name: Cache managed Homebrew runtime
description: Cache managed runtime kegs and opt links using official cache actions
runs:
  using: composite
  steps:
    - name: Plan runtime Cellar cache
      id: plan
      shell: bash
      env:
        HOMEBREW_NO_AUTO_UPDATE: "1"
      run: |
        set -euo pipefail
        HOMEBREW_DEVELOPER=1 brew test-bot --only-cleanup-before
        installed="$(brew list --formula)"
        if [ -n "$installed" ]; then
          echo "::error::Homebrew runtime cache requires a clean formula inventory."
          exit 1
        fi
        cellar="$(brew --cellar)"
        opt="$(brew --prefix)/opt"
        if [[ "$cellar" != /*/Cellar ]]; then
          echo "::error::Unexpected Homebrew Cellar path."
          exit 1
        fi
        roots="$(brew bundle list --brews --file=Brewfile)"
        if [ -z "$roots" ]; then
          echo "::error::Runtime Brewfile must declare formulae."
          exit 1
        fi
        formulae=()
        while IFS= read -r formula; do
          formulae+=("$formula")
        done <<< "$roots"
        dependencies="$(brew deps --union --include-build --formula "${formulae[@]}")"
        while IFS= read -r formula; do
          if [ -n "$formula" ]; then formulae+=("$formula"); fi
        done <<< "$dependencies"
        brew info --json=v2 "${formulae[@]}" > "$RUNNER_TEMP/runtime-formulae.json"
        versions="$(brew ruby -e '
          require "json"
          require "digest"
          formulae = JSON.parse(File.read(ARGV.fetch(0))).fetch("formulae")
          rows = formulae.uniq { |f| f.fetch("name") }.map do |f|
            [f.fetch("name"), f.fetch("versions").fetch("stable"), f.fetch("revision"),
             f.dig("bottle", "stable", "rebuild"), f["ruby_source_checksum"]]
          end.sort_by(&:first)
          raise "Empty runtime metadata" if rows.empty?
          print Digest::SHA256.hexdigest(JSON.generate(rows))
        ' "$RUNNER_TEMP/runtime-formulae.json")"
        echo "cellar=$cellar" >> "$GITHUB_OUTPUT"
        echo "opt=$opt" >> "$GITHUB_OUTPUT"
        echo "key=homebrew-runtime-v2-$(sw_vers -productVersion)-$(uname -m)-${{ hashFiles('Brewfile') }}-$versions" >> "$GITHUB_OUTPUT"

    - name: Look up runtime Cellar
      id: lookup
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ steps.plan.outputs.cellar }}
          ${{ steps.plan.outputs.opt }}
        key: ${{ steps.plan.outputs.key }}
        lookup-only: true

    - name: Restore runtime Cellar
      id: restore
      if: steps.lookup.outputs.cache-hit == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ steps.plan.outputs.cellar }}
          ${{ steps.plan.outputs.opt }}
        key: ${{ steps.plan.outputs.key }}
        fail-on-cache-miss: true

    - name: Relink restored runtime
      if: steps.lookup.outputs.cache-hit == 'true'
      shell: bash
      env:
        HOMEBREW_NO_AUTO_UPDATE: "1"
      run: |
        set -euo pipefail
        installed="$(brew list --formula)"
        if [ -z "$installed" ] || printf '%s\n' "$installed" | grep -Fxq korvid; then
          echo "::error::Invalid restored runtime formula inventory."
          exit 1
        fi
        while IFS= read -r formula; do
          if [ ! -d "$(brew --prefix "$formula")" ]; then
            echo "::error::Missing restored opt link for $formula."
            exit 1
          fi
        done <<< "$installed"
        while IFS= read -r formula; do
          brew link --overwrite --force "$formula"
          brew postinstall "$formula"
        done <<< "$installed"

    - name: Install declared runtime
      shell: bash
      env:
        HOMEBREW_NO_AUTO_UPDATE: "1"
      run: |
        set -euo pipefail
        brew bundle --file=Brewfile
        brew bundle check --file=Brewfile
        python="$(brew --prefix python@3.13)/bin/python3.13"
        "$python" -Im venv "$RUNNER_TEMP/runtime-cache-probe"
        "$RUNNER_TEMP/runtime-cache-probe/bin/python" -I -c 'import pip, ssl, sqlite3, zlib'

    - name: Save runtime Cellar
      id: save
      if: steps.lookup.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ steps.plan.outputs.cellar }}
          ${{ steps.plan.outputs.opt }}
        key: ${{ steps.plan.outputs.key }}
