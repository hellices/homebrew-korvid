name: Automatic Homebrew delivery

on:
  workflow_run:
    workflows: [Test formula]
    types: [completed]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Deployment PR number to requalify after resolving a failure
        required: true
        type: string
      dry_run:
        description: Validate only; do not mint a write token or merge
        type: boolean
        default: true

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  deliver:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (vars.HOMEBREW_APP_SLUG != '' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    concurrency:
      group: delivery-pr-${{ github.event.workflow_run.head_branch || inputs.pull_request }}
      cancel-in-progress: false
    steps:
      - name: Checkout trusted policy
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: main
          persist-credentials: false

      - name: Qualify deployment
        id: qualify
        env:
          GH_TOKEN: ${{ github.token }}
          HOMEBREW_APP_SLUG: ${{ vars.HOMEBREW_APP_SLUG }}
          PR_NUMBER: ${{ inputs.pull_request }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [ -n "$RUN_ID" ]; then
            args=(--run "$RUN_ID")
          else
            args=(--pr "$PR_NUMBER")
          fi
          python3 scripts/auto_merge_delivery.py "${args[@]}"

      - name: Check delivery App configuration
        if: steps.qualify.outputs.head != '' && (github.event_name != 'workflow_dispatch' || !inputs.dry_run)
        env:
          APP_ID: ${{ vars.HOMEBREW_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$APP_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo "::error::Configure HOMEBREW_APP_ID and HOMEBREW_APP_PRIVATE_KEY before automatic delivery."
            exit 1
          fi

      - name: Create delivery App token
        id: app-token
        if: steps.qualify.outputs.head != '' && (github.event_name != 'workflow_dispatch' || !inputs.dry_run)
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349  # v2
        with:
          app-id: ${{ vars.HOMEBREW_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
          owner: hellices
          repositories: homebrew-korvid
          permission-contents: write
          permission-pull-requests: write

      - name: Merge qualified head
        if: steps.qualify.outputs.head != '' && (github.event_name != 'workflow_dispatch' || !inputs.dry_run)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.qualify.outputs.pr }}
          HEAD_SHA: ${{ steps.qualify.outputs.head }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          EXPECTED_APP_SLUG: ${{ vars.HOMEBREW_APP_SLUG }}
        run: |
          set -euo pipefail
          if ! [ "$APP_SLUG" = "$EXPECTED_APP_SLUG" ]; then
            echo "::error::Delivery token identity does not match the qualified PR author."
            exit 1
          fi
          python3 scripts/auto_merge_delivery.py --pr "$PR_NUMBER" --merge-head "$HEAD_SHA"

      - name: Report blocked delivery
        if: failure()
        run: |
          echo "Automatic delivery stopped without bypassing checks or reviews. Resolve the reported cause and dispatch this workflow for the same PR to requalify it." >> "$GITHUB_STEP_SUMMARY"
