name: Test formula

on:
  push:
    branches: [main]
  pull_request:
  # A formula can break without anyone touching it: a yanked sdist or a
  # withdrawn upstream release is only visible from an actual build.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@master

      # brew refuses `audit`/`install` by path; the formula has to be
      # reached through a tap. Tapping this checkout is what a user's
      # `brew tap hellices/korvid` does, so it also tests the tap layout.
      - name: Tap this checkout
        run: |
          tap="$(brew --repository)/Library/Taps/hellices/homebrew-korvid"
          mkdir -p "$(dirname "$tap")"
          ln -s "$GITHUB_WORKSPACE" "$tap"
          brew tap-info hellices/korvid

      - name: Audit
        run: brew audit --strict hellices/korvid/korvid

      - name: Install from source
        run: brew install --build-from-source --verbose hellices/korvid/korvid

      # brew prints the log *paths* and exits; without this the only
      # thing a reader gets is "did not build".
      - name: Show the build log on failure
        if: failure()
        run: |
          for log in ~/Library/Logs/Homebrew/korvid/* \
                     ~/.cache/Homebrew/Logs/korvid/*; do
            [ -f "$log" ] || continue
            echo "::group::$log"
            tail -60 "$log"
            echo "::endgroup::"
          done

      - name: brew test
        run: brew test hellices/korvid/korvid

      - name: The installed command reports its version
        run: korvid --version
