name: Maintainer approval

# The gate that makes "the maintainer decides what lands" true rather than
# merely written down.
#
# A branch ruleset cannot express it: GitHub refuses to let an author approve
# their own pull request, so a required-approval rule deadlocks a solo
# maintainer, and the admin bypass that lifts the deadlock lifts every other
# rule with it - a bypassing merge sails past required checks, unresolved
# threads and all. An environment reviewer is the one approval GitHub does
# let you give yourself, so it is the only mechanism that both holds every
# pull request and stays unblockable by its own maintainer.
#
# This job does nothing. Its value is that it cannot start until a human
# clicks Approve on the `maintainer-approval` environment, and it is a
# required status check - so until that click, the pull request cannot merge.

on:
  # `pull_request_target`, not `pull_request`, and this is the whole point.
  # A `pull_request` workflow runs the version of itself that the pull
  # request carries, so the branch under review defines its own gate: delete
  # the `environment:` line below, keep the job name, and the required check
  # goes green with nobody approving anything. `pull_request_target` runs the
  # copy on the base branch, which a pull request cannot reach.
  #
  # The usual danger of this trigger - a privileged token turned loose on
  # untrusted code - is absent by construction: `permissions: {}` leaves the
  # token with nothing, nothing is checked out, and the only step echoes two
  # values passed through `env` rather than interpolated into the shell.
  # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    branches: [main]

permissions: {}

concurrency:
  # Cancelling a run that is still waiting for approval is safe, and was
  # verified rather than assumed: when a second commit arrived on the pull
  # request that introduced this file, the cancelled run stayed attached to
  # the superseded SHA and the new head SHA carried exactly one
  # `maintainer-approval` check, in `waiting`. Required checks are evaluated
  # against the head SHA, so no `cancelled` result is ever the one that
  # counts. Leaving old runs alive would be the worse option here: they would
  # queue up approval requests for diffs that no longer exist, on a gate
  # whose whole meaning is that the click is the decision.
  group: maintainer-approval-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  maintainer-approval:
    name: maintainer-approval
    runs-on: ubuntu-latest
    environment: maintainer-approval
    # Five minutes bounds the job, not the wait. A job held for environment
    # approval sits in `waiting`, and `timeout-minutes` only starts counting
    # once it reaches `in_progress` - observed directly: a run of this
    # workflow sat at `waiting` for over 11 minutes under this same 5-minute
    # value without being cancelled. The distinction matters more than usual
    # here: the ruleset has no bypass actors, so a job that timed out while
    # waiting would block every merge with no way around it.
    timeout-minutes: 5
    steps:
      - name: Record the approval
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "Approved by a reviewer of the maintainer-approval environment."
          echo "PR #${PR_NUMBER} at ${HEAD_SHA}"
